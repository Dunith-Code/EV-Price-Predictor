<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Price Predictor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h1 { color: #1a73e8; text-align: center; margin-bottom: 25px; font-size: 24px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        input, select { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        input[type="submit"] { background-color: #1a73e8; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        input[type="submit"]:hover { background-color: #1557b0; }
        .result { background: #e7f3ff; color: #1a73e8; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>EV Price Predictor</h1>
        <form action="/predict" method="post">
            <label for="brand">Manufacturer:</label>
            <select name="brand" id="brand">
                {% for b in brands %}<option value="{{ b }}">{{ b }}</option>{% endfor %}
            </select>

            <label for="model">Model Name:</label>
            <input type="text" id="model" name="model" placeholder="e.g. Model 3" required>

            <label for="battery">Battery Size (kWh):</label>
            <input type="number" id="battery" name="battery" placeholder="e.g. 75" step="0.1" required>

            <label for="autonomy">Autonomy Level (0-5):</label>
            <input type="number" id="autonomy" name="autonomy" placeholder="e.g. 3" required>

            <label for="safety">Safety Rating (1-5):</label>
            <input type="number" id="safety" name="safety" placeholder="e.g. 5" required>

            <label for="year">Manufacture Year:</label>
            <input type="number" id="year" name="year" placeholder="e.g. 2024" required>

            <input type="submit" value="Predict Price">
        </form>

        {% if prediction %}
        <div class="result">
            {{ prediction }}
        </div>
        {% endif %}
    </div>
</body>
</html>
